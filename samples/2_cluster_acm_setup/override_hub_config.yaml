RUN:
  bin_dir: './bin'
  client_version: '4.21.0-0.nightly'
DEPLOYMENT:
  force_download_installer: false
  installer_version : "4.21.0-0.nightly"
  ssh_key: "~/.ssh/id_ed25519.pub"
  # ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/x86_64/clients/ocp"
ENV_DATA:
  region: 'us-east-1'
  worker_replicas: 4
  master_instance_type: 'm5.xlarge'
  worker_instance_type: 'm5.2xlarge'
  service_network_cidr: "172.31.0.0/16"
  cluster_network_cidr: "10.132.0.0/14"
  skip_ocp_deployment: false
  skip_ocs_deployment: false
  skip_ocs_cluster_creation: false
  enable_ocs_plugin: true
  ocs_registry_image: "quay.io/rhceph-dev/ocs-registry:latest-stable-4.21.0"
  ocs_csv_channel: "stable-4.21"
  ocs_version: '4.21'
  cnv_version: '4.21'
MULTICLUSTER:
  parallel_ocp_deployment: false
  acm_cluster: true
  primary_cluster: true
  configure_submariner: true
  skip_mco_deployment: false
  enable_mco_plugin: true
  deploy_acm_hub_cluster: true
  import_managed_clusters: true
  exchange_ssl_certificate: true
  # comment this out for acm unreleased version
  # acm_hub_channel: 'release-2.13'
  # enable this for ACM un-released build
  acm_hub_unreleased: true
  acm_unreleased_image: "2.16.1-DOWNSTREAM-2026-04-14-12-41-13"
  mce_unreleased_image: "2.11.1-DOWNSTREAM-2026-04-16-18-29-12"
  deploy_cnv: true
  skip_gitops_deployment: false
  configure_discovered_dr: true
  deploy_workloads: true
  workload_types:
    - busybox_rbd
    - mysql_rbd
    - cnv_vm_pvc
REPORTING:
  email:
    skip_notification: true
  messenger:
    skip_notification: false
