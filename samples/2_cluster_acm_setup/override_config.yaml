RUN:
  bin_dir: './bin'
  client_version: '4.21.0-0.nightly'
DEPLOYMENT:
  force_download_installer: true
  installer_version : "4.21.0-0.nightly"
  ssh_key: "~/.ssh/id_ed25519.pub"
  # ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp"
ENV_DATA:
  region: 'us-east-1'
  worker_replicas: 4
  master_instance_type: 'm5.xlarge'
  worker_instance_type: 'm5.2xlarge'
  skip_ocp_deployment: false
  skip_ocs_deployment: false
  skip_ocs_cluster_creation: false
  enable_ocs_plugin: true
  ocs_registry_image: "quay.io/rhceph-dev/ocs-registry:latest-stable-4.21.0"
  # ocs_registry_image: "quay.io/rhceph-dev/ocs-registry:latest-konflux-upgrade-4.20.0"
  ocs_csv_channel: "stable-4.21"
  ocs_version: '4.21'
REPORTING:
  email:
    skip_notification: true
  messenger:
    skip_notification: false
