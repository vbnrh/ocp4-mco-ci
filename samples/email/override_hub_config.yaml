RUN:
  client_version: 'candidate-4.14'
DEPLOYMENT:
  force_download_installer: false
  installer_version : "candidate-4.14"
  ssh_key: "~/.ssh/id_rsa.pub"
  ocp_mirror_url: "https://mirror.openshift.com/pub/openshift-v4/clients/ocp"
ENV_DATA:
  region: 'us-east-1'
  master_instance_type: 'm5.xlarge'
  worker_instance_type: 'm5.2xlarge'
  service_network_cidr: "172.31.0.0/16"
  cluster_network_cidr: "10.132.0.0/14"
  skip_ocp_deployment: true
  skip_ocs_deployment: true
  skip_ocs_cluster_creation: true
  enable_ocs_plugin: false
  ocs_registry_image: "quay.io/rhceph-dev/ocs-registry:latest-stable-4.15.0"
  ocs_csv_channel: "stable-4.15"
  ocs_version: '4.15'
MULTICLUSTER:
  acm_cluster: true
  primary_cluster: true
  configure_submariner: false
  skip_mco_deployment: true
  enable_mco_plugin: false
  deploy_acm_hub_cluster: false
  import_managed_clusters: false
  exchange_ssl_certificate: false
  # comment this out for acm unreleased version
  # acm_hub_channel: 'release-2.7'
  # enable this for ACM un-released build
  acm_hub_unreleased: false
  acm_unreleased_image: "2.9.1-DOWNSTREAM-2023-12-04-14-34-12"
  skip_gitops_deployment: true
REPORTING:
  email:
    skip_notification: true
  messenger:
    skip_notification: false
    type: 'gchat'
